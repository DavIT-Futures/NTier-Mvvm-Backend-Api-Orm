name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-client:
    name: Client (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: windows-x64
          - rid: win-x86
            platform: windows-x86

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Client UI
        run: dotnet publish TestAppUI/TestAppUI.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o ./publish

      - name: Clean up PDBs
        shell: pwsh
        run: Remove-Item -Force ./publish/*.pdb -ErrorAction SilentlyContinue

      - name: Archive
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_name }}") { "${{ github.ref_name }}" } else { "v1.0.0" }
          $filename = "TestAppUI-$ver-${{ matrix.platform }}.zip"
          Compress-Archive -Path ./publish/* -DestinationPath ./$filename -Force

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./TestAppUI-${{ github.ref_name }}-${{ matrix.platform }}.zip

  build-server:
    name: Server (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: windows-x64
            format: zip
          - rid: linux-x64
            platform: linux-x64
            format: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish WCF Service
        run: dotnet publish WCFService/WCFService.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o ./publish

      - name: Clean up PDBs
        shell: pwsh
        run: Remove-Item -Force ./publish/*.pdb -ErrorAction SilentlyContinue

      - name: Archive
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_name }}") { "${{ github.ref_name }}" } else { "v1.0.0" }
          if ("${{ matrix.format }}" -eq "zip") {
            $filename = "WCFService-$ver-${{ matrix.platform }}.zip"
            Compress-Archive -Path ./publish/* -DestinationPath ./$filename -Force
          } else {
            $filename = "WCFService-$ver-${{ matrix.platform }}.tar.gz"
            tar -czf ./$filename -C ./publish .
          }

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./WCFService-${{ github.ref_name }}-${{ matrix.platform }}.*
